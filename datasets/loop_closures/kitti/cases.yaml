# Loop closure registration cases from the KITTI odometry benchmark (see
# README.md, LICENSE).
#
# Each case registers `local` against `global` (.mm files, one "points" layer,
# each in its own keyframe frame). Poses are [x, y, z, yaw, pitch, roll]
# ([m], [deg]) of `local` seen from `global`.
#  - kind: loop (they overlap; a registration must find reference_pose),
#    wrong_match (they do not overlap at the matched place, or barely; a
#    registration method found the given wrong_solutions in the past) or
#    no_loop (far apart; a registration must report failure).
#  - reference_pose: ground truth refined by ICP (reference_quality: ratio of
#    paired points); gt_pose: the ground truth relative pose before refinement
#    (off by up to ~1.5 m at some revisits).
#  - initial_guess_odometry: the relative pose from LiDAR-only odometry
#    without loop closure (the guess a SLAM back end would have);
#    odometry_error: its error vs the ground truth [m, deg].
#  - global_odometry_pose, local_odometry_pose: poses of the two keyframes in
#    that odometry frame (the first scan's): roll and pitch are estimated, not
#    absolute, but drift little on these mostly level roads.
#  - gt_distance: distance between the two keyframes [m].
#  - Names: <sequence>_<what makes the case hard>: yaw (revisit facing another
#    way), drift (largest odometry error), far (largest separation), typical,
#    none, gterr<N> (the ground truth is 3-7 m off there: reference from ICP
#    only, which converges to the same pose from the ground truth and from the
#    loop a mapper accepted); _map: the global side is a local map of 21 keyframes.
