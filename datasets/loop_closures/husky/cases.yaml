    kind: loop
    global: husky/husky03_kf0798.mm
    local: husky/husky03_kf1437.mm
    reference_pose: [-14.728600, -2.205900, 0.351200, -138.910000, -2.370000, -0.420000]
    reference_quality: 0.343
    gt_pose: [-14.747095, -2.118552, 0.469587, -140.142899, -0.943194, 0.039610]
    initial_guess_odometry: [-15.238469, 20.444313, -0.501863, -142.484632, -1.029940, 0.081109]
    global_odometry_pose: [-16.701688, 38.651718, 2.517209, -15.586188, -2.118585, -1.022427]
