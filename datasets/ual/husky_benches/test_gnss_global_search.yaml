# Localization with the initial pose from the state estimator, which fuses the
# u-blox GNSS (no RTK, sigma ~4 m, ~5 m off the ground truth here) and the
# absolute attitude IMU (azimuth) while the robot stands still, in the
# geo-referenced map. That pose is too uncertain for ICP alone: LIO must search
# for it in the map around it (global search), where the repeated benches and
# the long wall give several similar matches.
dataset: dataset.yaml

initial_localization:
  method: InitLocalization::FromStateEstimator
  gnss_mode: relocalize
  gnss_topic: /a200_0812/gnss/ublox
  attitude_imu_topic: /a200_0812/taobotics/imu
  env:
    MOLA_LO_INIT_GLOBAL_SEARCH: true
    # The state estimator reports convergence with position sigmas up to the
    # global search limit (MOLA_LO_INIT_GLOBAL_SEARCH_MAX_POS_SIGMA, 5 m):
    # without RTK, its z sigma stays above 1 m.
    MOLA_SE_CONVERGENCE_POS_SIGMA: 5.0

expected:
  # Compared with the ground truth over the last seconds of the fragment
  # (robot still after the maneuver):
  evaluate_last_seconds: 4.0
  localized: true
  max_position_error: 0.5 # [m]
  max_yaw_error_deg: 3.0
  # The pose must come from the global search:
  log_contains: "Global search: localized"
